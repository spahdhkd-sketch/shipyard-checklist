      .btnTextWhite { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #ffffff; }
      .btnTextDanger { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #be123c; }
