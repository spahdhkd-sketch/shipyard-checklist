<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>작업자 카드 수정 레이아웃 시안</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fbff;
      --line: #dbe3ee;
      --line-strong: #cbd5e1;
      --text: #172033;
      --muted: #64748b;
      --brand: #0f766e;
      --brand-soft: #eef7f5;
      --danger: #be123c;
      --danger-soft: #fff1f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 28px auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.25;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .worker-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .worker-card {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 154px;
    }

    .worker-card.is-open {
      background: var(--surface-soft);
      border-color: #c9d7e8;
    }

    .worker-card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
    }

    .worker-name {
      display: block;
      margin-bottom: 5px;
      font-size: 20px;
      font-weight: 900;
      line-height: 1.2;
    }

    .worker-team {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .worker-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
    }

    .badge.pre {
      border-color: #bae6fd;
      background: #e0f2fe;
      color: #075985;
    }

    .badge.post {
      border-color: #fed7aa;
      background: #fff7ed;
      color: #9a3412;
    }

    .badge.role {
      border-color: #99f6e4;
      background: #f0fdfa;
      color: var(--brand);
    }

    .badge.empty {
      border-color: #fecdd3;
      background: var(--danger-soft);
      color: var(--danger);
    }

    button {
      min-height: 38px;
      border-radius: 7px;
      border: 1px solid transparent;
      padding: 0 13px;
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: default;
      white-space: nowrap;
    }

    .btn-light {
      border-color: #9dd6c5;
      background: var(--brand-soft);
      color: var(--brand);
    }

    .btn-main {
      background: var(--brand);
      color: #ffffff;
    }

    .btn-danger {
      border-color: #fecdd3;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .worker-edit {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #475569;
      font-size: 12px;
      font-weight: 900;
    }

    input,
    select {
      width: 100%;
      min-width: 0;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      padding: 0 10px;
      font: inherit;
      font-size: 14px;
    }

    .edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .mobile-sample {
      margin-top: 34px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .mobile-frame {
      width: min(430px, 100%);
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfdff;
    }

    .mobile-frame .worker-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .mobile-frame .worker-card {
      min-height: 132px;
      padding: 12px;
    }

    .mobile-frame .worker-card-head {
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }

    .mobile-frame .worker-name {
      font-size: 16px;
    }

    .mobile-frame .worker-team {
      font-size: 12px;
    }

    .mobile-frame .badge {
      min-height: 21px;
      padding-inline: 7px;
      font-size: 11px;
    }

    .mobile-frame button {
      min-height: 34px;
      font-size: 13px;
    }

    .mobile-frame .worker-card-head .btn-light {
      width: auto;
      min-width: 74px;
      min-height: 32px;
      padding: 0 8px;
      justify-self: end;
      font-size: 12px;
    }

    .mobile-frame .edit-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .mobile-frame .edit-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 760px) {
      main {
        width: min(100vw - 20px, 620px);
        padding: 18px;
      }

      .worker-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .worker-card {
        padding: 12px;
      }

      .worker-card-head {
        grid-template-columns: minmax(0, 1fr);
      }

      .edit-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>작업자 카드 수정 레이아웃</h1>
    <p class="lead">접힌 카드에는 작업자 정보와 알림수정 버튼만 남기고, 수정/삭제와 상세 입력은 펼친 카드 안으로 넣는 방향입니다.</p>

    <section class="worker-grid" aria-label="데스크톱 3열 작업자 카드">
      <article class="worker-card">
        <div class="worker-card-head">
          <div>
            <strong class="worker-name">김민수</strong>
            <span class="worker-team">선행팀</span>
          </div>
          <button class="btn-light" type="button">알림수정</button>
        </div>
        <div class="worker-badges">
          <span class="badge pre">선행</span>
          <span class="badge role">조장</span>
          <span class="badge role">알림 1대</span>
        </div>
      </article>

      <article class="worker-card">
        <div class="worker-card-head">
          <div>
            <strong class="worker-name">박지훈</strong>
            <span class="worker-team">후행팀</span>
          </div>
          <button class="btn-light" type="button">알림수정</button>
        </div>
        <div class="worker-badges">
          <span class="badge post">후행</span>
          <span class="badge">작업자</span>
          <span class="badge empty">알림 없음</span>
        </div>
      </article>

      <article class="worker-card">
        <div class="worker-card-head">
          <div>
            <strong class="worker-name">이서연</strong>
            <span class="worker-team">선행팀</span>
          </div>
          <button class="btn-light" type="button">알림수정</button>
        </div>
        <div class="worker-badges">
          <span class="badge pre">선행</span>
          <span class="badge role">대표</span>
          <span class="badge role">알림 2대</span>
        </div>
      </article>

      <article class="worker-card is-open">
        <div class="worker-card-head">
          <div>
            <strong class="worker-name">최하늘</strong>
            <span class="worker-team">관리팀</span>
          </div>
          <button class="btn-light" type="button">알림수정</button>
        </div>
        <div class="worker-badges">
          <span class="badge">관리</span>
          <span class="badge role">알림 1대</span>
        </div>
        <div class="worker-edit">
          <div class="edit-grid">
            <label>이름<input value="최하늘" /></label>
            <label>사번/비밀번호<input value="1042" /></label>
            <label>팀 성격<select><option>선행</option><option>후행</option><option selected>관리</option></select></label>
            <label>배지<select><option>작업자</option><option>조장</option><option>대표</option><option selected>관리</option><option>총무</option></select></label>
          </div>
          <div class="edit-actions">
            <button class="btn-main" type="button">수정</button>
            <button class="btn-danger" type="button">삭제</button>
          </div>
        </div>
      </article>

      <article class="worker-card">
        <div class="worker-card-head">
          <div>
            <strong class="worker-name">정다은</strong>
            <span class="worker-team">총무팀</span>
          </div>
          <button class="btn-light" type="button">알림수정</button>
        </div>
        <div class="worker-badges">
          <span class="badge">총무</span>
          <span class="badge role">알림 1대</span>
        </div>
      </article>

      <article class="worker-card">
        <div class="worker-card-head">
          <div>
            <strong class="worker-name">한도윤</strong>
            <span class="worker-team">후행팀</span>
          </div>
          <button class="btn-light" type="button">알림수정</button>
        </div>
        <div class="worker-badges">
          <span class="badge post">후행</span>
          <span class="badge">작업자</span>
          <span class="badge empty">알림 없음</span>
        </div>
      </article>
    </section>

    <section class="mobile-sample" aria-label="모바일 2열 샘플">
      <h2 class="section">모바일 2열 샘플</h2>
      <p class="lead">모바일 화면에서는 같은 카드가 1줄 2명으로 배치됩니다.</p>
      <div class="mobile-frame">
        <div class="worker-grid">
          <article class="worker-card">
            <div class="worker-card-head">
              <div><strong class="worker-name">김민수</strong><span class="worker-team">선행팀</span></div>
              <button class="btn-light" type="button">알림수정</button>
            </div>
            <div class="worker-badges"><span class="badge pre">선행</span><span class="badge role">조장</span></div>
          </article>
          <article class="worker-card">
            <div class="worker-card-head">
              <div><strong class="worker-name">박지훈</strong><span class="worker-team">후행팀</span></div>
              <button class="btn-light" type="button">알림수정</button>
            </div>
            <div class="worker-badges"><span class="badge post">후행</span><span class="badge">작업자</span></div>
          </article>
          <article class="worker-card is-open">
            <div class="worker-card-head">
              <div><strong class="worker-name">이서연</strong><span class="worker-team">선행팀</span></div>
              <button class="btn-light" type="button">알림수정</button>
            </div>
            <div class="worker-badges"><span class="badge pre">선행</span><span class="badge role">대표</span></div>
            <div class="worker-edit">
              <div class="edit-grid">
                <label>이름<input value="이서연" /></label>
                <label>사번/비밀번호<input value="1042" /></label>
                <label>팀 성격<select><option>선행</option><option>후행</option><option>관리</option></select></label>
                <label>배지<select><option>작업자</option><option>조장</option><option selected>대표</option><option>관리</option><option>총무</option></select></label>
              </div>
              <div class="edit-actions">
                <button class="btn-main" type="button">수정</button>
                <button class="btn-danger" type="button">삭제</button>
              </div>
            </div>
          </article>
          <article class="worker-card">
            <div class="worker-card-head">
              <div><strong class="worker-name">최하늘</strong><span class="worker-team">관리팀</span></div>
              <button class="btn-light" type="button">알림수정</button>
            </div>
            <div class="worker-badges"><span class="badge">관리</span><span class="badge role">알림 1대</span></div>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
